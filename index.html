<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>評分系統 — 管理後台</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="firebase-config.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0f1117;--surface:#1a1d27;--surface2:#22263a;--border:#2e3352;
    --accent:#4f8ef7;--accent2:#7c6af7;--green:#3dd68c;--yellow:#f7c948;--red:#f75f5f;
    --text:#e8eaf6;--muted:#8892b0;
  }
  body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
  header{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 32px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100}
  header h1{font-size:18px;font-weight:700;color:var(--accent)}
  header span{font-size:13px;color:var(--muted)}
  .badge{background:var(--accent2);color:#fff;font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600}
  .container{max-width:1100px;margin:0 auto;padding:32px 24px}
  .grid{display:grid;grid-template-columns:340px 1fr;gap:24px;align-items:start}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px}
  .card h2{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:20px;font-weight:500}
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;margin-top:14px}
  input,select{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-size:14px;font-family:inherit;outline:none;transition:.2s}
  input:focus,select:focus{border-color:var(--accent)}
  button{cursor:pointer;font-family:inherit;font-size:14px;font-weight:600;border:none;border-radius:8px;padding:11px 20px;transition:.2s}
  .btn-primary{background:var(--accent);color:#fff;width:100%;margin-top:18px}
  .btn-primary:hover{background:#3a7de8}
  .btn-danger{background:rgba(247,95,95,.15);color:var(--red);border:1px solid rgba(247,95,95,.3);padding:6px 12px;font-size:12px;border-radius:6px}
  .btn-danger:hover{background:rgba(247,95,95,.25)}
  .btn-sm{background:var(--surface2);color:var(--text);border:1px solid var(--border);padding:6px 12px;font-size:12px;border-radius:6px}
  .btn-sm:hover{border-color:var(--accent);color:var(--accent)}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
  .stat{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center}
  .stat .num{font-size:28px;font-weight:700;color:var(--accent);font-family:'JetBrains Mono',monospace}
  .stat .lbl{font-size:12px;color:var(--muted);margin-top:4px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{color:var(--muted);font-weight:500;text-align:left;padding:8px 12px;border-bottom:1px solid var(--border);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
  td{padding:10px 12px;border-bottom:1px solid rgba(46,51,82,.5);vertical-align:middle}
  tr:hover td{background:rgba(79,142,247,.04)}
  .score-badge{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;padding:3px 10px;border-radius:6px;display:inline-block}
  .score-good{background:rgba(61,214,140,.12);color:var(--green)}
  .score-mid{background:rgba(247,201,72,.12);color:var(--yellow)}
  .score-low{background:rgba(247,95,95,.12);color:var(--red)}
  .score-none{background:var(--surface2);color:var(--muted)}
  .room-tag{font-size:11px;padding:2px 8px;border-radius:4px;font-weight:600}
  .room-interview{background:rgba(79,142,247,.15);color:var(--accent)}
  .room-practical{background:rgba(124,106,247,.15);color:var(--accent2)}
  #qr-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
  #qr-modal.show{display:flex}
  .modal-box{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:32px;text-align:center;min-width:300px}
  .modal-box h3{font-size:18px;margin-bottom:4px}
  .modal-box p{color:var(--muted);font-size:13px;margin-bottom:20px}
  #qr-container{background:#fff;padding:16px;border-radius:12px;display:inline-block;margin-bottom:20px}
  .modal-close{background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 24px;cursor:pointer;font-size:14px}
  .export-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .no-data{text-align:center;padding:48px;color:var(--muted);font-size:14px}
  .login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg)}
  .login-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:40px;width:360px}
  .login-card h1{font-size:22px;font-weight:700;color:var(--accent);margin-bottom:4px}
  .login-card p{color:var(--muted);font-size:13px;margin-bottom:28px}
  .status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
  .dot-green{background:var(--green)}
  .dot-yellow{background:var(--yellow)}
  .dot-gray{background:var(--muted)}
</style>
</head>
<body>

<!-- Login -->
<div class="login-wrap" id="login-page">
  <div class="login-card">
    <h1>🏫 評分管理系統</h1>
    <p>請輸入管理員密碼登入</p>
    <label>管理員密碼</label>
    <input type="password" id="admin-pw" placeholder="輸入密碼" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn-primary" onclick="doLogin()">登入管理後台</button>
    <p style="margin-top:16px;font-size:12px;color:var(--muted);text-align:center">其他頁面：<a href="scan.html" style="color:var(--accent)">掃碼頁</a> | <a href="interview.html" style="color:var(--accent)">面試評分</a> | <a href="practical.html" style="color:var(--accent)">術科評分</a> | <a href="results.html" style="color:var(--accent)">成績總表</a></p>
  </div>
</div>

<!-- Main App -->
<div id="main-app" style="display:none">
  <header>
    <div>
      <h1>📊 評分管理後台</h1>
    </div>
    <span class="badge">管理員</span>
    <span style="margin-left:auto;font-size:13px;color:var(--muted)" id="live-indicator">
      <span class="status-dot dot-green"></span>即時同步中
    </span>
    <button class="btn-sm" onclick="logout()" style="margin-left:12px">登出</button>
  </header>

  <div class="container">
    <div class="grid">
      <!-- Left: Add candidate -->
      <div>
        <div class="card">
          <h2>➕ 新增考生</h2>
          <label>考生姓名</label>
          <input type="text" id="c-name" placeholder="例：王小明">
          <label>考生號碼</label>
          <input type="text" id="c-num" placeholder="例：001">
          <button class="btn-primary" onclick="addCandidate()">新增考生</button>
        </div>

        <div class="card" style="margin-top:16px">
          <h2>📥 批次新增</h2>
          <label>每行一位（姓名 號碼）</label>
          <textarea id="batch-input" rows="6" style="width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px;color:var(--text);font-size:13px;font-family:inherit;resize:vertical" placeholder="王小明 001&#10;李小華 002&#10;張大明 003"></textarea>
          <button class="btn-primary" onclick="batchAdd()">批次新增</button>
        </div>

        <div class="card" style="margin-top:16px">
          <h2>⚠️ 危險操作</h2>
          <button class="btn-danger" style="width:100%" onclick="clearAll()">清除所有考生資料</button>
        </div>
      </div>

      <!-- Right: Candidates list -->
      <div>
        <div class="stats" id="stats-bar">
          <div class="stat"><div class="num" id="s-total">0</div><div class="lbl">總考生數</div></div>
          <div class="stat"><div class="num" id="s-done">0</div><div class="lbl">已完成評分</div></div>
          <div class="stat"><div class="num" id="s-avg">—</div><div class="lbl">平均總分</div></div>
        </div>

        <div class="card">
          <h2>👥 考生名單</h2>
          <div class="export-bar">
            <button class="btn-sm" onclick="exportCSV()">📤 匯出 CSV</button>
            <button class="btn-sm" onclick="printAll()">🖨️ 列印所有 QR</button>
            <input type="text" id="search" placeholder="搜尋姓名或號碼..." style="flex:1;margin:0" oninput="renderTable()">
          </div>
          <div style="overflow-x:auto">
            <table>
              <thead>
                <tr>
                  <th>號碼</th>
                  <th>姓名</th>
                  <th>面試平均</th>
                  <th>術科平均</th>
                  <th>指派教室</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="table-body">
                <tr><td colspan="6" class="no-data">載入中...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- QR Modal -->
<div id="qr-modal">
  <div class="modal-box">
    <h3 id="qr-name">考生姓名</h3>
    <p id="qr-num">號碼：001</p>
    <div id="qr-container"><div id="qr-canvas"></div></div>
    <br>
    <button class="modal-close" onclick="closeQR()">關閉</button>
  </div>
</div>

<div id="print-area" style="display:none"></div>

<script>
firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.database();
let candidates = {};

function doLogin(){
  const pw = document.getElementById('admin-pw').value;
  if(TEACHERS[pw] && TEACHERS[pw].type === 'admin'){
    document.getElementById('login-page').style.display='none';
    document.getElementById('main-app').style.display='block';
    initApp();
  } else {
    alert('密碼錯誤');
  }
}
function logout(){
  document.getElementById('main-app').style.display='none';
  document.getElementById('login-page').style.display='flex';
  document.getElementById('admin-pw').value='';
}

function initApp(){
  db.ref('candidates').on('value', snap=>{
    candidates = snap.val() || {};
    renderTable();
    updateStats();
  });
}

function renderTable(){
  const q = (document.getElementById('search').value||'').toLowerCase();
  const body = document.getElementById('table-body');
  const list = Object.values(candidates).filter(c=>
    !q || c.name.toLowerCase().includes(q) || c.number.includes(q)
  ).sort((a,b)=>a.number.localeCompare(b.number));

  if(!list.length){
    body.innerHTML='<tr><td colspan="6" class="no-data">尚無考生資料</td></tr>';
    return;
  }
  body.innerHTML = list.map(c=>{
    const iv = avgScore(c.interviewScores);
    const pr = avgScore(c.practicalScores);
    const room = c.assignedRoom||'—';
    return `<tr>
      <td><span style="font-family:'JetBrains Mono',monospace;color:var(--muted)">${c.number}</span></td>
      <td><strong>${c.name}</strong></td>
      <td>${scoreBadge(iv)}</td>
      <td>${scoreBadge(pr)}</td>
      <td>${room==='—'?'<span style="color:var(--muted)">未指派</span>':`<span class="room-tag room-practical">${room}</span>`}</td>
      <td style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn-sm" onclick="showQR('${c.id}')">QR</button>
        <button class="btn-danger" onclick="deleteCandidate('${c.id}')">刪除</button>
      </td>
    </tr>`;
  }).join('');
}

function scoreBadge(v){
  if(v===null) return '<span class="score-badge score-none">未評</span>';
  const cls = v>=80?'score-good':v>=60?'score-mid':'score-low';
  return `<span class="score-badge ${cls}">${v.toFixed(1)}</span>`;
}

function avgScore(obj){
  if(!obj) return null;
  const vals = Object.values(obj).filter(v=>v!==null&&v!==undefined&&v!=='');
  if(!vals.length) return null;
  return vals.reduce((a,b)=>a+Number(b),0)/vals.length;
}

function updateStats(){
  const list = Object.values(candidates);
  document.getElementById('s-total').textContent = list.length;
  const done = list.filter(c=>avgScore(c.interviewScores)!==null&&avgScore(c.practicalScores)!==null);
  document.getElementById('s-done').textContent = done.length;
  if(done.length){
    const avg = done.reduce((a,c)=>{
      const iv=avgScore(c.interviewScores), pr=avgScore(c.practicalScores);
      return a+(iv+pr)/2;
    },0)/done.length;
    document.getElementById('s-avg').textContent = avg.toFixed(1);
  } else {
    document.getElementById('s-avg').textContent='—';
  }
}

function addCandidate(){
  const name=document.getElementById('c-name').value.trim();
  const num=document.getElementById('c-num').value.trim();
  if(!name||!num){alert('請填寫姓名和號碼');return}
  const id='c_'+Date.now();
  db.ref('candidates/'+id).set({id,name,number:num,createdAt:Date.now()});
  document.getElementById('c-name').value='';
  document.getElementById('c-num').value='';
}

function batchAdd(){
  const lines=document.getElementById('batch-input').value.trim().split('\n');
  lines.forEach(line=>{
    const parts=line.trim().split(/\s+/);
    if(parts.length>=2){
      const id='c_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);
      db.ref('candidates/'+id).set({id,name:parts[0],number:parts[1],createdAt:Date.now()});
    }
  });
  document.getElementById('batch-input').value='';
}

function deleteCandidate(id){
  if(confirm('確定刪除此考生？'))db.ref('candidates/'+id).remove();
}
function clearAll(){
  if(confirm('確定清除所有考生資料？此操作無法復原！')){
    if(confirm('再次確認：清除所有資料？')){
      db.ref('candidates').remove();
    }
  }
}

let qrInstance=null;
function showQR(id){
  const c=candidates[id];
  if(!c)return;
  document.getElementById('qr-name').textContent=c.name;
  document.getElementById('qr-num').textContent='號碼：'+c.number;
  document.getElementById('qr-canvas').innerHTML='';
  const url=location.origin+location.pathname.replace('index.html','')+`scan.html?id=${id}`;
  qrInstance=new QRCode(document.getElementById('qr-canvas'),{text:url,width:200,height:200,colorDark:'#000',colorLight:'#fff'});
  document.getElementById('qr-modal').classList.add('show');
}
function closeQR(){document.getElementById('qr-modal').classList.remove('show')}

function exportCSV(){
  const rows=[['號碼','姓名','面試平均','術科平均','指派教室','面試老師','術科老師']];
  Object.values(candidates).sort((a,b)=>a.number.localeCompare(b.number)).forEach(c=>{
    const iv=avgScore(c.interviewScores), pr=avgScore(c.practicalScores);
    const iTeachers=Object.keys(c.interviewScores||{}).join('/');
    const pTeachers=Object.keys(c.practicalScores||{}).join('/');
    rows.push([c.number,c.name,iv?.toFixed(1)||'',pr?.toFixed(1)||'',c.assignedRoom||'',iTeachers,pTeachers]);
  });
  const csv=rows.map(r=>r.join(',')).join('\n');
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,\uFEFF'+encodeURIComponent(csv);
  a.download='成績總表.csv';a.click();
}

function printAll(){
  const win=window.open('','_blank');
  const items=Object.values(candidates).sort((a,b)=>a.number.localeCompare(b.number));
  const base=location.origin+location.pathname.replace('index.html','')+'scan.html?id=';
  win.document.write(`<!DOCTYPE html><html><head><title>QR列印</title>
  <style>body{font-family:sans-serif}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:16px}
  .item{border:1px solid #ccc;border-radius:8px;padding:12px;text-align:center;page-break-inside:avoid}
  h3{margin:8px 0 2px;font-size:16px}.sub{color:#666;font-size:13px}
  @media print{button{display:none}}</style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"><\/script>
  </head><body>
  <button onclick="window.print()" style="margin:16px;padding:8px 20px">🖨️ 列印</button>
  <div class="grid">${items.map(c=>`<div class="item"><div id="q${c.id}"></div><h3>${c.name}</h3><div class="sub">號碼：${c.number}</div></div>`).join('')}
  </div>
  <script>
  ${items.map(c=>`new QRCode(document.getElementById('q${c.id}'),{text:'${base+c.id}',width:160,height:160})`).join(';')}
  <\/script></body></html>`);
}
</script>
</body>
</html>
