<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>掃碼指派教室</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="firebase-config.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d1117;--s:#161b22;--s2:#21262d;--b:#30363d;--ac:#58a6ff;--ac2:#bc8cff;--g:#3fb950;--y:#d29922;--r:#f85149;--t:#e6edf3;--m:#8b949e}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--t);min-height:100vh}
</style>
<style id="nav-css"></style>
<style>
.wrap{max-width:460px;margin:0 auto;padding:20px 16px}
.card{background:var(--s);border:1px solid var(--b);border-radius:16px;padding:20px;margin-bottom:14px}
.ch2{font-size:12px;color:var(--m);text-transform:uppercase;letter-spacing:.08em;margin-bottom:14px}
.mode-tabs{display:flex;gap:8px;margin-bottom:16px}
.mtab{flex:1;padding:10px;border-radius:8px;background:var(--s2);border:1px solid var(--b);color:var(--m);cursor:pointer;text-align:center;font-size:13px;font-weight:500;transition:.12s}
.mtab.on{background:var(--ac);color:#000;border-color:var(--ac)}
input{width:100%;background:var(--s2);border:1px solid var(--b);border-radius:8px;padding:10px 14px;color:var(--t);font-size:14px;font-family:inherit;outline:none}
input:focus{border-color:var(--ac)}
.btn{cursor:pointer;font-family:inherit;font-weight:600;border:none;border-radius:10px;padding:11px;font-size:14px;transition:.12s;width:100%;margin-top:10px}
.ba{background:var(--ac);color:#000}.ba:hover{filter:brightness(1.1)}
.bo{background:transparent;border:1px solid var(--b);color:var(--m)}.bo:hover{border-color:var(--ac);color:var(--ac)}
#reader{border-radius:10px;overflow:hidden}
.result{background:var(--s2);border:2px solid var(--g);border-radius:14px;padding:20px;text-align:center;display:none}
.result.show{display:block}
.r-name{font-size:24px;font-weight:700;margin-bottom:4px}
.r-num{color:var(--m);font-size:13px;margin-bottom:14px}
.r-room{font-size:42px;font-weight:700;color:var(--g);font-family:monospace}
.r-teachers{font-size:13px;color:var(--ac2);margin-top:8px}
.r-info{font-size:12px;color:var(--m);margin-top:6px}
.already-b{background:rgba(210,153,34,.1);border:1px solid rgba(210,153,34,.3);color:var(--y);border-radius:6px;padding:2px 10px;font-size:11px;display:inline-block;margin-bottom:6px}
.hi{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--s2);border-radius:8px;margin-top:6px;font-size:13px}
.hr{font-weight:700;color:var(--ac2)}
</style>
</head>
<body>
<div id="NAV"></div>
<div class="wrap">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
    <div>
      <h2 style="font-size:18px;font-weight:700;color:var(--ac)">📱 掃碼指派教室</h2>
      <p style="font-size:12px;color:var(--m);margin-top:2px">術科考場外工作人員使用</p>
    </div>
  </div>

  <div class="card">
    <div class="mode-tabs">
      <div class="mtab on" onclick="switchMode('camera',this)">📷 掃 QR Code</div>
      <div class="mtab" onclick="switchMode('manual',this)">⌨️ 手動輸入</div>
    </div>

    <div id="mode-camera">
      <div id="reader"></div>
      <button class="btn ba" id="start-btn" onclick="startScan()">開始掃描</button>
      <button class="btn bo" id="stop-btn" style="display:none" onclick="stopScan()">停止掃描</button>
    </div>

    <div id="mode-manual" style="display:none">
      <label style="font-size:12px;color:var(--m);display:block;margin-bottom:6px">貼上 scan.html?id= 後面的考生ID</label>
      <input type="text" id="manual-id" placeholder="考生 ID">
      <button class="btn ba" onclick="processManual()">指派教室</button>
    </div>
  </div>

  <div class="result card" id="result">
    <div id="already-b" class="already-b" style="display:none">⚠️ 此考生已指派過教室</div>
    <div class="r-name" id="r-name">—</div>
    <div class="r-num" id="r-num">—</div>
    <div style="font-size:13px;color:var(--m);margin-bottom:4px">隨機指派至</div>
    <div class="r-room" id="r-room">—</div>
    <div class="r-teachers" id="r-teachers">—</div>
    <div class="r-info" id="r-info">—</div>
    <button class="btn bo" style="margin-top:14px" onclick="resetResult()">繼續掃下一位</button>
  </div>

  <div class="card">
    <div class="ch2">📋 最近指派記錄</div>
    <div id="hist"><p style="color:var(--m);font-size:13px">尚無記錄</p></div>
  </div>
</div>

<script>
document.getElementById('nav-css').textContent = NAV_CSS;
document.getElementById('NAV').innerHTML = buildNav('scan');
firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.database();
let scanner = null, hist = [];

window.addEventListener('load', () => {
  const id = new URLSearchParams(location.search).get('id');
  if (id) processCandidate(id);
});

function switchMode(m, el) {
  document.querySelectorAll('.mtab').forEach(t => t.classList.toggle('on', t === el));
  document.getElementById('mode-camera').style.display = m === 'camera' ? 'block' : 'none';
  document.getElementById('mode-manual').style.display = m === 'manual' ? 'block' : 'none';
  if (m !== 'camera' && scanner) stopScan();
}

function startScan() {
  document.getElementById('start-btn').style.display = 'none';
  document.getElementById('stop-btn').style.display = 'block';
  scanner = new Html5Qrcode('reader');
  scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 240, height: 240 } }, url => {
    stopScan();
    try { const id = new URL(url).searchParams.get('id'); if (id) processCandidate(id); else alert('QR碼無效'); }
    catch (e) { alert('QR碼格式錯誤'); }
  }, () => { });
}
function stopScan() {
  if (scanner) scanner.stop().catch(() => { });
  document.getElementById('start-btn').style.display = 'block';
  document.getElementById('stop-btn').style.display = 'none';
}
function processManual() {
  const id = document.getElementById('manual-id').value.trim();
  if (id) processCandidate(id);
}

function processCandidate(id) {
  db.ref('candidates/' + id).once('value').then(snap => {
    const c = snap.val();
    if (!c) { alert('找不到此考生'); return; }
    const isNew = !c.assignedRoom;
    const room = isNew ? PRACTICAL_ROOMS[Math.floor(Math.random() * PRACTICAL_ROOMS.length)] : c.assignedRoom;
    if (isNew) {
      db.ref('candidates/' + id).update({ assignedRoom: room, assignedAt: Date.now() });
      db.ref('practicalQueue/' + room).push({ candidateId: id, name: c.name, school: c.school || '', dept: c.dept || '', regNo: c.regNo, assignedAt: Date.now() });
    }
    const teachers = Object.values(TEACHERS).filter(t => t.room === room && t.type === 'practical');
    document.getElementById('r-name').textContent = c.name;
    document.getElementById('r-num').textContent = '序號：' + c.regNo;
    document.getElementById('r-room').textContent = room;
    document.getElementById('r-teachers').textContent = '👩‍🏫 ' + teachers.map(t => t.name).join('、');
    document.getElementById('r-info').textContent = (c.school || '') + (c.dept ? ' ／ ' + c.dept : '');
    document.getElementById('already-b').style.display = isNew ? 'none' : 'inline-block';
    document.getElementById('result').classList.add('show');
    hist.unshift({ name: c.name, regNo: c.regNo, room, time: new Date().toLocaleTimeString() });
    if (hist.length > 8) hist.pop();
    renderHist();
    document.getElementById('manual-id').value = '';
    history.replaceState(null, '', location.pathname);
  }).catch(() => alert('連線失敗，請確認網路'));
}

function resetResult() { document.getElementById('result').classList.remove('show'); }
function renderHist() {
  const el = document.getElementById('hist');
  if (!hist.length) { el.innerHTML = '<p style="color:var(--m);font-size:13px">尚無記錄</p>'; return; }
  el.innerHTML = hist.map(h => `<div class="hi">
    <span><strong>${h.name}</strong> <span style="color:var(--m)">${h.regNo}</span></span>
    <span><span class="hr">${h.room}</span> <span style="color:var(--m);font-size:11px">${h.time}</span></span>
  </div>`).join('');
}
</script>
</body>
</html>
