<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>面試評分 — CM316</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#0a0e1a;--surface:#131929;--surface2:#1c2236;--border:#253060;--accent:#5b9cf6;--accent2:#a78bfa;--green:#34d399;--yellow:#fbbf24;--red:#f87171;--text:#e2e8f0;--muted:#64748b}
  body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
  .login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg)}
  .login-card{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:40px;width:360px;text-align:center}
  .login-card .icon{font-size:48px;margin-bottom:16px}
  .login-card h1{font-size:20px;font-weight:700;color:var(--accent);margin-bottom:6px}
  .login-card p{color:var(--muted);font-size:13px;margin-bottom:24px}
  input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px 16px;color:var(--text);font-size:16px;font-family:inherit;outline:none;text-align:center;letter-spacing:.2em}
  input:focus{border-color:var(--accent)}
  button{cursor:pointer;font-family:inherit;font-weight:600;border:none;border-radius:10px;padding:12px;font-size:15px;transition:.2s;width:100%;margin-top:12px}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{filter:brightness(1.1)}
  .btn-success{background:var(--green);color:#063}
  .btn-success:hover{filter:brightness(1.05)}
  .btn-outline{background:transparent;color:var(--text);border:1px solid var(--border);margin-top:8px}
  .btn-outline:hover{border-color:var(--accent);color:var(--accent)}
  header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
  .teacher-info{display:flex;align-items:center;gap:10px}
  .avatar{width:36px;height:36px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff}
  .teacher-name{font-size:14px;font-weight:600}
  .teacher-room{font-size:12px;color:var(--muted)}
  .live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;display:inline-block}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .container{max-width:700px;margin:0 auto;padding:28px 20px}
  .section-title{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:14px;margin-top:28px;font-weight:500}
  .section-title:first-child{margin-top:0}
  .candidate-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:12px;transition:.2s;cursor:pointer;position:relative}
  .candidate-card:hover{border-color:var(--accent);transform:translateY(-1px)}
  .candidate-card.active{border-color:var(--accent);background:var(--surface2)}
  .candidate-card.scored{border-color:var(--green)}
  .c-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:0}
  .c-name{font-size:17px;font-weight:700}
  .c-num{font-size:12px;color:var(--muted);font-family:'JetBrains Mono',monospace}
  .score-chip{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;padding:4px 12px;border-radius:20px}
  .chip-done{background:rgba(52,211,153,.15);color:var(--green)}
  .chip-none{background:var(--surface2);color:var(--muted)}
  .score-panel{display:none;margin-top:16px;border-top:1px solid var(--border);padding-top:16px}
  .score-panel.open{display:block}
  .score-label{font-size:14px;color:var(--muted);margin-bottom:8px}
  .score-input-wrap{display:flex;align-items:center;gap:12px}
  .score-input{width:120px;background:var(--surface2);border:2px solid var(--border);border-radius:10px;padding:12px;color:var(--text);font-size:24px;font-weight:700;font-family:'JetBrains Mono',monospace;outline:none;text-align:center}
  .score-input:focus{border-color:var(--accent)}
  .score-hint{font-size:12px;color:var(--muted)}
  .save-btn{margin-top:12px}
  .already-scored{background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.2);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--green);margin-top:8px}
  .partner-score{background:var(--surface2);border-radius:8px;padding:10px 14px;font-size:13px;margin-top:8px}
  .partner-name{color:var(--accent2);font-weight:600}
  .no-candidates{text-align:center;padding:60px 20px;color:var(--muted)}
  .no-candidates .emoji{font-size:48px;margin-bottom:12px}
  .search-bar{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 16px;color:var(--text);font-size:14px;font-family:inherit;outline:none;width:100%;margin-bottom:20px;letter-spacing:normal}
  .search-bar:focus{border-color:var(--accent)}
  .filter-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .ftab{padding:6px 14px;border-radius:20px;background:var(--surface2);border:1px solid var(--border);color:var(--muted);cursor:pointer;font-size:12px;font-weight:500;transition:.2s}
  .ftab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
</style>
</head>
<body>

<div class="login-wrap" id="login-page">
  <div class="login-card">
    <div class="icon">🎤</div>
    <h1>面試評分系統</h1>
    <p>CM316 面試室<br>請輸入您的個人密碼登入</p>
    <input type="password" id="pw" placeholder="輸入密碼" onkeydown="if(event.key==='Enter')doLogin()">
    <div id="login-err" style="color:var(--red);font-size:13px;margin-top:8px;display:none">密碼錯誤</div>
    <button class="btn-primary" onclick="doLogin()">登入</button>
  </div>
</div>

<div id="app" style="display:none">
  <header>
    <div class="teacher-info">
      <div class="avatar" id="h-avatar">?</div>
      <div>
        <div class="teacher-name" id="h-name">—</div>
        <div class="teacher-room">CM316 面試室</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <span class="live-dot"></span>
      <span style="font-size:12px;color:var(--muted)">即時同步</span>
      <button onclick="logout()" style="background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:12px;width:auto;margin:0">登出</button>
    </div>
  </header>

  <div class="container">
    <input class="search-bar" id="search" placeholder="🔍 搜尋考生姓名或號碼..." oninput="renderList()">
    <div class="filter-tabs">
      <div class="ftab active" data-f="all" onclick="setFilter('all',this)">全部</div>
      <div class="ftab" data-f="unscored" onclick="setFilter('unscored',this)">未評分</div>
      <div class="ftab" data-f="scored" onclick="setFilter('scored',this)">已評分</div>
    </div>
    <div id="list-container">
      <div class="no-candidates"><div class="emoji">⏳</div><p>載入中...</p></div>
    </div>
  </div>
</div>

<script>
firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.database();
let currentTeacher = null;
let candidates = {};
let filter = 'all';
let activeId = null;

function doLogin(){
  const pw = document.getElementById('pw').value.trim();
  const t = TEACHERS[pw];
  if(t && t.type === 'interview'){
    currentTeacher = {...t, pw};
    document.getElementById('login-page').style.display='none';
    document.getElementById('app').style.display='block';
    document.getElementById('h-name').textContent=t.name+' 委員';
    document.getElementById('h-avatar').textContent=t.name[0];
    initApp();
    document.getElementById('login-err').style.display='none';
  } else {
    document.getElementById('login-err').style.display='block';
  }
}
function logout(){
  document.getElementById('app').style.display='none';
  document.getElementById('login-page').style.display='flex';
  document.getElementById('pw').value='';
  currentTeacher=null;candidates={};
}

function initApp(){
  db.ref('candidates').on('value', snap=>{
    candidates = snap.val()||{};
    renderList();
  });
}

function setFilter(f,el){
  filter=f;
  document.querySelectorAll('.ftab').forEach(t=>t.classList.toggle('active',t===el));
  renderList();
}

function renderList(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const container=document.getElementById('list-container');
  let list=Object.values(candidates).filter(c=>{
    if(q && !c.name.toLowerCase().includes(q) && !c.number.includes(q)) return false;
    if(filter==='scored') return myScore(c)!==null;
    if(filter==='unscored') return myScore(c)===null;
    return true;
  }).sort((a,b)=>a.number.localeCompare(b.number));

  if(!list.length){
    container.innerHTML='<div class="no-candidates"><div class="emoji">📋</div><p>沒有考生</p></div>';
    return;
  }

  container.innerHTML='<div class="section-title">考生名單（共'+list.length+'位）</div>'+
    list.map(c=>buildCard(c)).join('');
}

function myScore(c){
  return c.interviewScores?.[currentTeacher.name]??null;
}

function partnerScore(c){
  const partner=Object.values(TEACHERS).find(t=>t.room==='CM316'&&t.type==='interview'&&t.name!==currentTeacher.name);
  if(!partner) return null;
  return c.interviewScores?.[partner.name]??null;
}

function buildCard(c){
  const ms=myScore(c);
  const ps=partnerScore(c);
  const partner=Object.values(TEACHERS).find(t=>t.room==='CM316'&&t.type==='interview'&&t.name!==currentTeacher.name);
  const isActive=activeId===c.id;
  return `<div class="candidate-card${ms!==null?' scored':''}${isActive?' active':''}" onclick="toggleCard('${c.id}')">
    <div class="c-header">
      <div>
        <div class="c-name">${c.name}</div>
        <div class="c-num">考生號碼：${c.number}</div>
      </div>
      <div>
        <span class="score-chip ${ms!==null?'chip-done':'chip-none'}">${ms!==null?ms+'分':'未評'}</span>
      </div>
    </div>
    <div class="score-panel${isActive?' open':''}" onclick="event.stopPropagation()">
      ${ms!==null?`<div class="already-scored">✅ 您已評分：<strong>${ms} 分</strong>　<button onclick="editScore('${c.id}')" style="background:transparent;border:1px solid var(--green);color:var(--green);border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;width:auto;margin:0">修改</button></div>`:`
      <div class="score-label">請輸入面試分數（0–100）</div>
      <div class="score-input-wrap">
        <input type="number" class="score-input" id="si-${c.id}" min="0" max="100" placeholder="—" onkeydown="if(event.key==='Enter')saveScore('${c.id}')">
        <div class="score-hint">0 — 100 分</div>
      </div>
      <button class="btn-success save-btn" onclick="saveScore('${c.id}')">✓ 確認送出</button>`}
      ${ps!==null?`<div class="partner-score">👤 <span class="partner-name">${partner?.name}</span> 委員已評：${ps} 分</div>`:''}
      ${ms!==null&&ps!==null?`<div class="partner-score" style="color:var(--green);border:1px solid rgba(52,211,153,.2)">📊 面試平均：<strong>${((ms+ps)/2).toFixed(1)} 分</strong></div>`:''}
    </div>
  </div>`;
}

function toggleCard(id){
  activeId = activeId===id?null:id;
  renderList();
  if(activeId){
    setTimeout(()=>{
      const el=document.getElementById('si-'+id);
      if(el) el.focus();
    },50);
  }
}

function editScore(id){
  db.ref('candidates/'+id+'/interviewScores/'+currentTeacher.name).remove().then(()=>{activeId=id;renderList();});
}

function saveScore(id){
  const el=document.getElementById('si-'+id);
  const v=parseInt(el.value);
  if(isNaN(v)||v<0||v>100){alert('請輸入 0 到 100 的整數分數');return;}
  db.ref('candidates/'+id+'/interviewScores/'+currentTeacher.name).set(v).then(()=>{
    activeId=null;renderList();
  });
}
</script>
</body>
</html>
