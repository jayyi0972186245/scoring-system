<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>面試評分 — CM316</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0e1a;--s:#131929;--s2:#1c2236;--b:#253060;--ac:#5b9cf6;--ac2:#a78bfa;--g:#34d399;--y:#fbbf24;--r:#f87171;--t:#e2e8f0;--m:#64748b}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--t);min-height:100vh}
</style>
<style id="nav-css"></style>
<style>
.lw{display:flex;align-items:center;justify-content:center;min-height:100vh}
.lc{background:var(--s);border:1px solid var(--b);border-radius:24px;padding:40px;width:360px;text-align:center}
.lc .ico{font-size:48px;margin-bottom:16px}
.lc h1{font-size:20px;font-weight:700;color:var(--ac);margin-bottom:6px}
.lc p{color:var(--m);font-size:13px;margin-bottom:24px}
.lc a{color:var(--ac);font-size:12px;display:block;margin-top:14px}
input.pw{width:100%;background:var(--s2);border:1px solid var(--b);border-radius:10px;padding:12px 16px;color:var(--t);font-size:16px;font-family:inherit;outline:none;text-align:center;letter-spacing:.2em}
input.pw:focus{border-color:var(--ac)}
.btn{cursor:pointer;font-family:inherit;font-weight:600;border:none;border-radius:10px;padding:12px;font-size:15px;transition:.2s;width:100%;margin-top:12px}
.bp{background:var(--ac);color:#fff}.bp:hover{filter:brightness(1.1)}
.bg{background:var(--g);color:#063}.bg:hover{filter:brightness(1.05)}
.bo{background:transparent;color:var(--m);border:1px solid var(--b);font-size:12px;padding:6px}.bo:hover{border-color:var(--ac);color:var(--ac)}
.header{background:var(--s);border-bottom:1px solid var(--b);padding:12px 20px;display:flex;align-items:center;justify-content:space-between}
.av{width:34px;height:34px;border-radius:50%;background:var(--ac);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff}
.container{max-width:680px;margin:0 auto;padding:22px 16px}
.search{width:100%;background:var(--s2);border:1px solid var(--b);border-radius:10px;padding:9px 14px;color:var(--t);font-size:14px;font-family:inherit;outline:none;margin-bottom:12px}
.search:focus{border-color:var(--ac)}
.ftabs{display:flex;gap:6px;margin-bottom:14px}
.ftab{padding:5px 12px;border-radius:14px;background:var(--s2);border:1px solid var(--b);color:var(--m);cursor:pointer;font-size:12px;font-weight:500;transition:.12s}
.ftab.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.cc{background:var(--s);border:1px solid var(--b);border-radius:14px;padding:16px;margin-bottom:10px;cursor:pointer;transition:.15s}
.cc:hover{border-color:var(--ac);transform:translateY(-1px)}
.cc.scored{border-color:var(--g)}
.cc.active{border-color:var(--ac);background:var(--s2)}
.cc-head{display:flex;justify-content:space-between;align-items:flex-start}
.cc-name{font-size:16px;font-weight:700}
.cc-sub{font-size:11px;color:var(--m);margin-top:2px}
.chip{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;padding:3px 10px;border-radius:14px;flex-shrink:0}
.chip-done{background:rgba(52,211,153,.15);color:var(--g)}
.chip-none{background:var(--s2);color:var(--m)}
.sp{display:none;margin-top:14px;border-top:1px solid var(--b);padding-top:14px}
.sp.open{display:block}
.score-row{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.si{width:110px;background:var(--s2);border:2px solid var(--b);border-radius:10px;padding:10px;color:var(--t);font-size:22px;font-weight:700;font-family:'JetBrains Mono',monospace;outline:none;text-align:center}
.si:focus{border-color:var(--ac)}
.si::-webkit-outer-spin-button,.si::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.si[type=number]{-moz-appearance:textfield}
.already{background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.2);border-radius:8px;padding:9px 12px;font-size:13px;color:var(--g);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.partner-box{background:var(--s2);border-radius:8px;padding:9px 12px;font-size:13px;margin-top:6px}
.avg-box{background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.2);border-radius:8px;padding:9px 12px;font-size:13px;color:var(--g);margin-top:6px}
.no-data{text-align:center;padding:48px;color:var(--m);font-size:14px}
</style>
</head>
<body>

<div class="lw" id="LP">
  <div class="lc">
    <div class="ico">🎤</div>
    <h1>面試評分</h1>
    <p>CM316 面試室<br>請輸入您的個人密碼</p>
    <input class="pw" type="password" id="pw" placeholder="輸入密碼" onkeydown="if(event.key==='Enter')login()">
    <div id="er" style="color:var(--r);font-size:12px;margin-top:6px;display:none">密碼錯誤</div>
    <button class="btn bp" onclick="login()">登入</button>
    <a href="index.html">← 返回管理後台</a>
  </div>
</div>

<div id="APP" style="display:none">
  <div id="NAV"></div>
  <div class="header">
    <div style="display:flex;align-items:center;gap:10px">
      <div class="av" id="h-av">?</div>
      <div>
        <div style="font-size:14px;font-weight:600" id="h-name">—</div>
        <div style="font-size:11px;color:var(--m)">CM316 面試室</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <span style="width:6px;height:6px;border-radius:50%;background:var(--g);animation:dot 2s infinite;display:inline-block"></span>
      <span style="font-size:11px;color:var(--m)">即時同步</span>
    </div>
  </div>

  <div class="container">
    <input class="search" id="search" placeholder="🔍 搜尋考生姓名或序號..." oninput="render()">
    <div class="ftabs">
      <div class="ftab on" onclick="setF('all',this)">全部</div>
      <div class="ftab" onclick="setF('unscored',this)">未評分</div>
      <div class="ftab" onclick="setF('scored',this)">已評分</div>
    </div>
    <div id="list"></div>
  </div>
</div>

<style>@keyframes dot{0%,100%{opacity:1}50%{opacity:.3}}</style>
<script>
document.getElementById('nav-css').textContent = NAV_CSS;
firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.database();
let teacher = null, candidates = {}, filt = 'all', activeId = null;

function login() {
  const pw = document.getElementById('pw').value.trim();
  document.getElementById('er').style.display = 'none';

  // 查 Firebase teachers 節點（唯一來源）
  db.ref('teachers').orderByChild('password').equalTo(pw).once('value').then(snap => {
    const data = snap.val();
    if (data) {
      const t = Object.values(data).find(t => t.type === 'interview');
      if (t) { doLoginWith(t); return; }
    }
    // fallback：查靜態內建（兼容尚未寫入 Firebase 的情況）
    const staticT = TEACHERS[pw];
    if (staticT?.type === 'interview') { doLoginWith({ name: staticT.name, room: staticT.room, type: 'interview' }); return; }
    document.getElementById('er').style.display = 'block';
  }).catch(() => {
    const staticT = TEACHERS[pw];
    if (staticT?.type === 'interview') doLoginWith({ name: staticT.name, room: staticT.room, type: 'interview' });
    else document.getElementById('er').style.display = 'block';
  });
}

function doLoginWith(t) {
  teacher = { ...t };
  document.getElementById('LP').style.display = 'none';
  document.getElementById('APP').style.display = 'block';
  document.getElementById('NAV').innerHTML = buildNav('interview', t.name + ' 委員', 'logout()');
  document.getElementById('h-name').textContent = t.name + ' 委員';
  document.getElementById('h-av').textContent = t.name[0];
  document.getElementById('er').style.display = 'none';
  db.ref('candidates').on('value', s => { candidates = s.val() || {}; render(); });
}
function logout() {
  document.getElementById('APP').style.display = 'none';
  document.getElementById('LP').style.display = 'flex';
  document.getElementById('pw').value = '';
  teacher = null; candidates = {};
}
function setF(f, el) { filt = f; document.querySelectorAll('.ftab').forEach(t => t.classList.toggle('on', t === el)); render(); }
function myScore(c) { return c.interviewScores?.[teacher.name] ?? null; }

function render() {
  const q = document.getElementById('search').value;
  let list = Object.values(candidates).filter(c => {
    if (!matchSearch(c, q)) return false;
    if (filt === 'scored') return myScore(c) !== null;
    if (filt === 'unscored') return myScore(c) === null;
    return true;
  }).sort((a, b) => String(a.regNo || '').localeCompare(String(b.regNo || '')));

  const el = document.getElementById('list');
  if (!list.length) { el.innerHTML = '<div class="no-data">沒有考生</div>'; return; }
  el.innerHTML = list.map(c => buildCard(c)).join('');
}

function buildCard(c) {
  const ms = myScore(c), isActive = activeId === c.id;
  return `<div class="cc${ms !== null ? ' scored' : ''}${isActive ? ' active' : ''}" onclick="toggle('${c.id}')">
    <div class="cc-head">
      <div>
        <div class="cc-name">${c.name}</div>
        <div class="cc-sub">序號：${c.regNo}　${c.school || ''}${c.dept ? ' ／ ' + c.dept : ''}</div>
      </div>
      <span class="chip ${ms !== null ? 'chip-done' : 'chip-none'}">${ms !== null ? ms + '分' : '未評'}</span>
    </div>
    <div class="sp${isActive ? ' open' : ''}" onclick="event.stopPropagation()">
      ${ms !== null
        ? `<div class="already"><span>✅ 您已評：<strong>${ms} 分</strong></span>
           <button onclick="editScore('${c.id}')" style="background:transparent;border:1px solid var(--g);color:var(--g);border-radius:6px;padding:3px 10px;font-size:11px;cursor:pointer;width:auto;margin:0">修改</button></div>`
        : `<div style="font-size:13px;color:var(--m);margin-bottom:8px">面試分數（0–100）</div>
           <div class="score-row">
             <input type="number" class="si" id="si-${c.id}" min="0" max="100" placeholder="—"
               oninput="let v=parseInt(this.value);if(!isNaN(v)){if(v>100)this.value=100;if(v<0)this.value=0;}"
               onkeydown="if(event.key==='Enter')save('${c.id}')">
             <span style="color:var(--m);font-size:12px">0 – 100 分</span>
           </div>
           <button class="btn bg" onclick="save('${c.id}')" style="margin-top:10px">✓ 確認送出</button>`}
    </div>
  </div>`;
}

function toggle(id) {
  activeId = activeId === id ? null : id; render();
  if (activeId) setTimeout(() => { const el = document.getElementById('si-' + id); if (el) el.focus(); }, 50);
}
function editScore(id) {
  db.ref('candidates/' + id + '/interviewScores/' + teacher.name).remove().then(() => { activeId = id; render(); });
}
function save(id) {
  const el = document.getElementById('si-' + id);
  const v = parseInt(el.value);
  if (isNaN(v) || v < 0 || v > 100) { alert('請輸入 0 到 100 的整數'); return; }
  db.ref('candidates/' + id + '/interviewScores/' + teacher.name).set(v).then(() => { activeId = null; render(); });
}
</script>
</body>
</html>
